name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir app
          unzip -q ./*.zip -d app
          echo "Files in project:"
          find app -maxdepth 3 | head -60

      - name: Detect project
        id: p
        run: |
          S=$(find app \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          if [ -z "$S" ]; then
            S=$(find app \( -name build.gradle -o -name build.gradle.kts \) | head -n1)
          fi
          if [ -z "$S" ]; then
            echo "No Gradle project found in the ZIP"
            exit 1
          fi
          D=$(dirname "$S")
          echo "dir=$D" >> $GITHUB_OUTPUT
          if [ -f "$D/gradlew" ]; then
            echo "wrapper=yes" >> $GITHUB_OUTPUT
          else
            echo "wrapper=no" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.p.outputs.wrapper == 'no'
        with:
          gradle-version: 8.9

      - name: Build with wrapper
        if: steps.p.outputs.wrapper == 'yes'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build with Gradle
        if: steps.p.outputs.wrapper == 'no'
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/**/*.apk
